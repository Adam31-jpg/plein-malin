# Vérifications à chaque push : types, lint, tests, et que jobs/collector.mjs est à jour.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Le job empaqueté correspond au code source
        run: |
          npm run build:job
          git diff --exit-code jobs/collector.mjs || (echo "::error::jobs/collector.mjs est périmé : lancez npm run build:job et commitez-le" && exit 1)
