services:
  db:
    image: postgres:17-alpine
    container_name: plein-malin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: plein
      POSTGRES_PASSWORD: plein
      POSTGRES_DB: plein_malin
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plein -d plein_malin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
